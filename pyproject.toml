[project]
name = "cli-autocomplete-auto-tool"
version = "0.1.0"
description = "Interactive CLI tool for path autocompletion and command execution"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.43",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
